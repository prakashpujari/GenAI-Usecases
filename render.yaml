services:
  - type: web
    name: mortgage-graph-api
    runtime: python
    plan: standard
    repo: https://github.com/prakashpujari/GenAI-Usecases
    branch: main
    rootDir: Graph-db
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NEO4J_URI
        value: "neo4j+s://5e8389cd.databases.neo4j.io"
      - key: NEO4J_USERNAME
        value: "5e8389cd"
      - key: NEO4J_PASSWORD
        value: "X5jQWpBNYLpnRtZEI13ntnWnpKCz1vkOOecIyWiGVwc"
      - key: NEO4J_DATABASE
        value: "5e8389cd"
      - key: STORAGE_BACKEND
        value: neo4j
      - key: LOG_LEVEL
        value: info
      - key: WORKERS
        value: "4"

  - type: web
    name: mortgage-graph-ui
    runtime: node
    plan: standard
    repo: https://github.com/prakashpujari/GenAI-Usecases
    branch: main
    rootDir: Graph-db/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run preview
    healthCheckPath: /
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://mortgage-graph-api.onrender.com"
      - key: VITE_API_TIMEOUT
        value: "30000"
      - key: NODE_ENV
        value: production

  - type: cron
    name: mortgage-graph-migrations
    runtime: python
    repo: https://github.com/prakashpujari/GenAI-Usecases
    branch: main
    rootDir: Graph-db
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.etl.migrate_schema
    schedule: "0 2 * * *"
    envVars:
      - key: NEO4J_URI
        value: "neo4j+s://5e8389cd.databases.neo4j.io"
      - key: NEO4J_USERNAME
        value: "5e8389cd"
      - key: NEO4J_PASSWORD
        value: "X5jQWpBNYLpnRtZEI13ntnWnpKCz1vkOOecIyWiGVwc"
      - key: NEO4J_DATABASE
        value: "5e8389cd"
      - key: STORAGE_BACKEND
        value: neo4j

  - type: cron
    name: mortgage-graph-gds-jobs
    runtime: python
    repo: https://github.com/prakashpujari/GenAI-Usecases
    branch: main
    rootDir: Graph-db
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.gds.run_gds_jobs
    schedule: "0 3 * * *"
    envVars:
      - key: NEO4J_URI
        value: "neo4j+s://5e8389cd.databases.neo4j.io"
      - key: NEO4J_USERNAME
        value: "5e8389cd"
      - key: NEO4J_PASSWORD
        value: "X5jQWpBNYLpnRtZEI13ntnWnpKCz1vkOOecIyWiGVwc"
      - key: NEO4J_DATABASE
        value: "5e8389cd"
      - key: STORAGE_BACKEND
        value: neo4j
