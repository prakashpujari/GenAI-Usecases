name: Deploy to Render

on:
  push:
    branches:
      - main
    paths:
      - 'Graph-db/**'
      - '.github/workflows/deploy-to-render.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          # Trigger Render deployment using API
          curl --request POST \
            --url https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_API }}/deploys \
            --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --header "Content-Type: application/json"

      - name: Deploy UI to Render
        run: |
          curl --request POST \
            --url https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_UI }}/deploys \
            --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --header "Content-Type: application/json"

      - name: Deployment Status
        run: |
          echo "✅ Deployment triggered to Render"
          echo "API Service: https://mortgage-graph-api.onrender.com"
          echo "UI Service: https://mortgage-graph-ui.onrender.com"
